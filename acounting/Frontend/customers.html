<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atas Books - Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <div class="sidebar">
            <div class="sidebar-logo"><img src="images/logo.png" alt="Atas Books"></div>
            <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
            <a href="customers.html" class="sidebar-link active"><i class="fas fa-users me-2"></i> Customers</a>
            <a href="vendors.html" class="sidebar-link"><i class="fas fa-truck me-2"></i> Vendors</a>
            <a href="inventory.html" class="sidebar-link"><i class="fas fa-box me-2"></i> Inventory</a>
            <a href="invoices.html" class="sidebar-link"><i class="fas fa-file-invoice me-2"></i> Invoices</a>
            <a href="credit_notes.html" class="sidebar-link"><i class="fas fa-file-alt me-2"></i> Credit Notes</a>
            <a href="expenses.html" class="sidebar-link"><i class="fas fa-money-bill-wave me-2"></i> Expenses</a>
            <a href="reports.html" class="sidebar-link"><i class="fas fa-chart-line me-2"></i> Reports</a>
            <a href="settings.html" class="sidebar-link"><i class="fas fa-cog me-2"></i> Settings</a>
        </div>

        <div class="main-content">
            <div class="top-nav">
                <h4>Customers</h4>
                <div>
                    <span class="text-dark me-3" id="userName">Welcome, User</span>
                    <a href="#" class="btn btn-primary btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i> Logout</a>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="search-bar flex-grow-1 me-2 mb-0">
                    <input type="text" class="form-control" id="searchCustomers" placeholder="Search customers...">
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                    <i class="fas fa-plus me-1"></i> Add Customer
                </button>
            </div>

            <div id="customerListContainer"></div>
        </div>
    </div>

    <!-- Add Customer Modal -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addCustomerForm">
                        <div class="mb-3">
                            <label class="form-label">Customer Name *</label>
                            <input type="text" class="form-control" id="custName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="custCompany">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="custEmail">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="custPhone">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Customer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Menu Modal -->
    <div class="modal fade" id="actionMenuModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="actionMenuTitle">Customer Name</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="action-menu-item" id="actionNewTransaction"><i class="fas fa-plus-circle"></i> New Transaction</div>
                    <div class="action-menu-item" id="actionEmail"><i class="fas fa-envelope"></i> Email</div>
                    <div class="action-menu-item" id="actionStatement"><i class="fas fa-file-invoice"></i> Statement</div>
                    <div class="action-menu-item" id="actionHistory"><i class="fas fa-history"></i> History</div>
                    <div class="action-menu-item danger" id="deleteCustomerBtn"><i class="fas fa-trash"></i> Delete</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Statement Preview Modal (NEW) -->
    <div class="modal fade" id="statementModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Customer Statement</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="statementPreviewBody" style="background-color: #f8fafc; padding: 40px;">
                    <!-- Statement HTML goes here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="downloadStatementBtn"><i class="fas fa-download me-1"></i> Download PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Magic PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
