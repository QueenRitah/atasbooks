<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atas Books - Accounting Made Simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
        <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#84cc16">
</head>
<body>
    <body>

       <!-- Auto-Login / Auto-Register Check -->
    <script>
        if (localStorage.getItem('userToken')) {
            // If they are logged in, send them to the Dashboard
            window.location.href = 'dashboard.html';
        } else {
            // If they are NOT logged in, send them straight to the Register page!
            window.location.href = 'register.html';
        }
    </script>

    <!-- Loading Screen -->
    <div id="loader-wrapper">

    <!-- Loading Screen -->
    <div id="loader-wrapper">
        <img src="images/logo.png" class="loader-logo" alt="Atas Books Logo">
        <div class="spinner"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.png" alt="Atas Books Logo" height="40" class="me-2">
                Atas Books
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary ms-2" href="register.html">Get Started</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="container mt-5">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="display-4 fw-bold" style="color: #84cc16;">Accounting Made Simple.</h1>
                <p class="lead text-dark mt-3">Manage your customers, create professional invoices, and track your expenses all in one place.</p>
                <div class="mt-4">
                    <a href="register.html" class="btn btn-primary btn-lg me-3">Start for Free</a>
                    <a href="login.html" class="btn btn-outline-primary btn-lg">Login</a>
                </div>
                
                <!-- Keywords from Logo -->
                <div class="row mt-5 text-center">
                    <div class="col"><p class="fw-bold text-success">MANAGE</p></div>
                    <div class="col"><p class="fw-bold text-success">ANALYZE</p></div>
                    <div class="col"><p class="fw-bold text-success">AUTOMATE</p></div>
                    <div class="col"><p class="fw-bold text-success">COLLABORATE</p></div>
                </div>
            </div>
                        <div class="col-md-6 text-center mt-4 mt-md-0">
                <img src="images/logo.png" class="img-fluid" style="max-width: 300px;" alt="Atas Books Logo">
                <p class="text-dark mt-3">Access Anywhere. Anytime.</p>
            </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Hide loader after 1.5 seconds
        setTimeout(() => {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
                loader.classList.add('loader-hidden');
            }
        }, 1500); 
    </script>
        <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker installed! App is now downloadable.'));
      }
    </script>
</body>
</html>
