<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atas Books - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <div class="sidebar">
            <div class="sidebar-logo"><img src="images/logo.png" alt="Atas Books"></div>
            <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
            <a href="customers.html" class="sidebar-link"><i class="fas fa-users me-2"></i> Customers</a>
            <a href="vendors.html" class="sidebar-link"><i class="fas fa-truck me-2"></i> Vendors</a>
            <a href="inventory.html" class="sidebar-link"><i class="fas fa-box me-2"></i> Inventory</a>
            <a href="invoices.html" class="sidebar-link"><i class="fas fa-file-invoice me-2"></i> Invoices</a>
            <a href="credit_notes.html" class="sidebar-link"><i class="fas fa-file-alt me-2"></i> Credit Notes</a>
            <a href="expenses.html" class="sidebar-link"><i class="fas fa-money-bill-wave me-2"></i> Expenses</a>
            <a href="reports.html" class="sidebar-link"><i class="fas fa-chart-line me-2"></i> Reports</a>
            <a href="settings.html" class="sidebar-link active"><i class="fas fa-cog me-2"></i> Settings</a>
        </div>

        <div class="main-content">
            <div class="top-nav">
                <h4>Settings</h4>
                <div>
                    <span class="text-dark me-3" id="userName">Welcome, User</span>
                    <a href="#" class="btn btn-primary btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i> Logout</a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-10">
                    
                    <!-- User Profile Card -->
                    <div class="stat-card mb-4">
                        <h5 class="mb-4" style="color: #172554;">User Profile</h5>
                        <form id="settingsForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="setName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="setEmail" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Save User Profile</button>
                        </form>
                    </div>

                    <!-- Company Profile Card (With Country & VAT) -->
                    <div class="stat-card">
                        <h5 class="mb-4" style="color: #172554;">Company Profile (For Invoices)</h5>
                        <form id="companyForm">
                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label class="form-label">Company Name</label>
                                        <input type="text" class="form-control" id="companyName" placeholder="e.g. Atas Proserve Ltd">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Company Address</label>
                                        <input type="text" class="form-control" id="companyAddress" placeholder="e.g. Coast, Kenya">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Company Email</label>
                                        <input type="email" class="form-control" id="companyEmail" placeholder="e.g. info@company.com">
                                    </div>
                                    
                                    <!-- COUNTRY & VAT SELECTORS -->
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Country</label>
                                            <select class="form-control" id="userCountry">
                                                <option value="Kenya">Kenya</option>
                                                <option value="Uganda">Uganda</option>
                                                <option value="Tanzania">Tanzania</option>
                                                <option value="Rwanda">Rwanda</option>
                                                <option value="Nigeria">Nigeria</option>
                                                <option value="United Kingdom">United Kingdom</option>
                                                <option value="USA">USA (No VAT)</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">VAT Rate (%)</label>
                                            <input type="number" step="0.01" class="form-control" id="userVatRate" value="16.00">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4 text-center">
                                    <img id="companyLogoPreview" src="https://via.placeholder.com/150/ffffff/172554?text=Logo" alt="Company Logo" class="rounded-circle mb-2" style="width: 120px; height: 120px; object-fit: cover; border: 2px solid #172554;">
                                    <div>
                                        <input type="file" id="companyLogoInput" accept="image/*" hidden>
                                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('companyLogoInput').click()">
                                            <i class="fas fa-camera"></i> Upload Logo
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Company Profile</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
