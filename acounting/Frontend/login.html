<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atas Books - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Auto-Login Check -->
    <script>
        if (localStorage.getItem('userToken')) {
            window.location.href = 'dashboard.html';
        }
    </script>

    <!-- Premium Loading Screen -->
    <div id="loader-wrapper">
        <img src="images/logo.png" class="loader-logo" alt="Atas Books Logo">
        <div class="spinner"></div>
    </div>

    <!-- Auth Container (Centered on screen) -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo at the top of the form -->
            <div class="text-center mb-4">
                <img src="images/logo.png" alt="Atas Books Logo" style="height: 60px;">
            </div>
            
            <h3>Welcome Back</h3>
            
            <!-- This is where errors will show up -->
            <div id="alertBox" style="display: none;"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            
            <p class="text-center mt-3 mb-0 text-dark">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Unstoppable Loading Screen: Hides after 1.5 seconds no matter what
        setTimeout(() => {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
                loader.classList.add('loader-hidden');
            }
        }, 1500); 
    </script>
</body>
</html>
